<!DOCTYPE html><html><head><meta charset="utf-8"><title>Dice seat tuner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a0a2e;overflow:hidden;font-family:system-ui;}
.viewport{position:fixed;inset:0;overflow:hidden;}
.cover{position:absolute;}
.cover>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;}
.stage{position:absolute;perspective:1000px;}
.frame{position:absolute;border-radius:8%;background:linear-gradient(#f7e6c8,#ecd0a4 60%,#e2c08c);border:3px solid #fff4e2;box-shadow:0 4px 10px rgba(0,0,0,.28),inset 0 2px 6px rgba(255,255,255,.6),inset 0 -6px 10px rgba(160,110,60,.35);}
.plat{position:absolute;border-radius:10% / 45%;background:linear-gradient(#c98a4b,#a9662f 55%,#86461d);box-shadow:0 4px 0 #6e3714,0 6px 8px rgba(0,0,0,.4),inset 0 2px 2px rgba(255,220,170,.5);}
.pos{position:absolute;top:0;left:0;transform-style:preserve-3d;}
.view{position:absolute;inset:0;transform-style:preserve-3d;}
.cube{position:absolute;inset:0;transform-style:preserve-3d;}
.face{position:absolute;inset:0;backface-visibility:hidden;}
.face img{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.28));}
.panel{position:fixed;top:8px;left:8px;z-index:100;background:rgba(0,0,0,.9);color:#fff;padding:12px;border-radius:10px;font:12px monospace;width:250px;}
.panel h4{margin-bottom:8px;}
.panel label{display:block;margin:4px 0;}
.panel input[type=range]{width:120px;vertical-align:middle;}
.panel .v{display:inline-block;width:52px;text-align:right;}
#out{margin-top:10px;font-size:11px;color:#9fd;white-space:pre;background:#111;padding:6px;border-radius:6px;}
</style></head><body>
<div class="viewport"><div class="cover" id="cover">
<img class="bg" src="/colorgame/bg-full.png?v=3" alt="">
<div class="stage" id="stage"><div class="frame" id="frame"></div><div class="plat" id="plat"></div></div>
</div></div>
<div class="panel">
<h4>Dice seat tuner</h4>
<label>Die Y <input type="range" id="dy" min="0.08" max="0.28" step="0.002" value="0.165"><span class="v" id="vdy"></span></label>
<label>Ledge Y <input type="range" id="ly" min="12" max="30" step="0.5" value="21"><span class="v" id="vly"></span></label>
<label>Die size <input type="range" id="ds" min="0.13" max="0.26" step="0.005" value="0.19"><span class="v" id="vds"></span></label>
<label>Spacing <input type="range" id="sp" min="0.16" max="0.30" step="0.005" value="0.25"><span class="v" id="vsp"></span></label>
<label>Frame T <input type="range" id="ft" min="0" max="15" step="0.5" value="2"><span class="v" id="vft"></span></label>
<label>Frame H <input type="range" id="fh" min="15" max="35" step="0.5" value="25"><span class="v" id="vfh"></span></label>
<div id="out"></div>
</div>
<script>
const IMG_AR=2,COLORS=["red","blue","yellow","pink","white","green"];
const SRC=c=>`/colorgame/dice/die_face_${c}.png?v=2`;
const FTF={red:"rotateY(0deg)",blue:"rotateY(180deg)",yellow:"rotateY(-90deg)",pink:"rotateY(90deg)",white:"rotateX(90deg)",green:"rotateX(-90deg)"};
const STAGE={l:30,t:6,w:23,h:72},FRAME_W=82;
const bet=['green','pink','blue'];
const cover=document.getElementById('cover'),stage=document.getElementById('stage'),frame=document.getElementById('frame'),plat=document.getElementById('plat');
function layoutCover(){const vw=innerWidth,vh=innerHeight;let w,h,x,y;if(vw/vh>IMG_AR){w=vw;h=vw/IMG_AR;x=0;y=(vh-h)/2;}else{h=vh;w=vh*IMG_AR;x=(vw-w)/2;y=0;}cover.style.left=x+'px';cover.style.top=y+'px';cover.style.width=w+'px';cover.style.height=h+'px';layout();}
addEventListener('resize',layoutCover);
let D=[];
function build(){D=bet.map(()=>{const pos=document.createElement('div');pos.className='pos';const view=document.createElement('div');view.className='view';const cube=document.createElement('div');cube.className='cube';cube.style.transform='rotateX(0deg) rotateY(0deg)';
COLORS.forEach(c=>{const f=document.createElement('div');f.className='face';f.dataset.c=c;const img=document.createElement('img');f.appendChild(img);cube.appendChild(f);});
view.appendChild(cube);pos.appendChild(view);stage.appendChild(pos);return{pos,view,cube,faces:[...cube.children]};});}
const $=id=>document.getElementById(id);
function layout(){
  const REST_Y=+$('dy').value,PLATFORM_Y=+$('ly').value,DIE_FR=+$('ds').value,SP=+$('sp').value,FRAME_T=+$('ft').value,FRAME_H=+$('fh').value;
  const REST_X=[0.5-SP,0.5,0.5+SP];
  $('vdy').textContent=REST_Y.toFixed(3);$('vly').textContent=PLATFORM_Y+'%';$('vds').textContent=DIE_FR.toFixed(3);$('vsp').textContent=SP.toFixed(3);$('vft').textContent=FRAME_T+'%';$('vfh').textContent=FRAME_H+'%';
  stage.style.left=STAGE.l+'%';stage.style.top=STAGE.t+'%';stage.style.width=STAGE.w+'%';stage.style.height=STAGE.h+'%';
  const w=stage.clientWidth,h=stage.clientHeight,diePx=DIE_FR*w,R=diePx/2;
  const fw=w*FRAME_W/100,fh=h*FRAME_H/100;frame.style.width=fw+'px';frame.style.height=fh+'px';frame.style.left=(w-fw)/2+'px';frame.style.top=(FRAME_T/100*h)+'px';
  const pw=w*0.6,ph=h*0.035;plat.style.width=pw+'px';plat.style.height=ph+'px';plat.style.left=(w-pw)/2+'px';plat.style.top=(PLATFORM_Y/100*h)+'px';
  D.forEach((d,i)=>{d.pos.style.width=diePx+'px';d.pos.style.height=diePx+'px';
    d.faces.forEach(f=>f.style.transform=`${FTF[f.dataset.c]} translateZ(${R}px)`);
    const bf=bet[i];const map={};COLORS.forEach(c=>map[c]=c);map.red=bf;map[bf]='red';
    d.faces.forEach(f=>f.querySelector('img').src=SRC(map[f.dataset.c]));
    d.view.style.transform='rotateX(0deg) rotateY(0deg)';
    d.pos.style.transform=`translate(${REST_X[i]*w-R}px,${REST_Y*h-R}px)`;});
  $('out').textContent=`REST_Y = ${REST_Y.toFixed(3)}\nPLATFORM_Y = ${PLATFORM_Y}\nDIE_FR = ${DIE_FR.toFixed(3)}\nREST_X = [${REST_X.map(x=>x.toFixed(3)).join(', ')}]\nFRAME_T = ${FRAME_T}\nFRAME_H = ${FRAME_H}`;
}
['dy','ly','ds','sp','ft','fh'].forEach(id=>$(id).addEventListener('input',layout));
build();layoutCover();
</script></body></html>
